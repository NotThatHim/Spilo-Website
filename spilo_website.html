<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spilo Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root">
        <div class="searchBar">

            <input type="text" id="characterDropDown" list="characters" placeholder="Character">

            <!--
            A good rule of thumb as a developer is to encourage laziness. A good developer hates repeating themselves.
            If you notice that you are doing something twice, you should take a minute to think about how you can make
            sure you can avoid extra work. This is good because not only are we lazy now, but in the future when we want
            to adjust something, we don't have to worry about remembering to update it in multiple places. For instance, 
            you have a list of characters and ranks definded in your script.js file and then repeated here. When a new character
            is added next season, you are going to have to remember to add it to both the constant in script.js and also to
            add it as an option in this list. Maybe you could use a loop to build that list for you?

            For example, you already know that you can use javascript to target elements in your DOM (the HTML here) and
            append videos to the grid. Maybe you could use that same idea to build the list of options of characters for the dropdown?
            -->
            <datalist id="characters">
                <option value="Ana">
                <option value="Anran">
                <option value="Ashe">
                <option value="Baptiste">
                <option value="Bastion">
                <option value="Brigitte">
                <option value="Cassidy">
                <option value="DVA">
                <option value="Doomfist">
                <option value="Echo">
                <option value="Emre">
                <option value="Freja">
                <option value="Genji">
                <option value="Hanzo">
                <option value="Hazard">
                <option value="Illari">
                <option value="Junkerqueen">
                <option value="Junkrat">
                <option value="Juno">
                <option value="Kiriko">
                <option value="Lifeweaver">
                <option value="Lucio">
                <option value="Mauga">
                <option value="Mei">
                <option value="Mercy">
                <option value="Mizuki">
                <option value="Moira">
                <option value="Orisa">
                <option value="Pharah">
                <option value="Ramattra">
                <option value="Reaper">
                <option value="Reinhardt">
                <option value="Roadhog">
                <option value="Sigma">
                <option value="Sojourn">
                <option value="Soldier: 76">
                <option value="Sombra">
                <option value="Symmetra">
                <option value="Torbjorn">
                <option value="Tracer">
                <option value="Vendetta">
                <option value="Venture">
                <option value="Widowmaker">
                <option value="Winston">
                <option value="Wrecking Ball">
                <option value="Wuyang">
                <option value="Zarya">
                <option value="Zenyatta">
            </datalist>

            <input type="text" id="rankDropDown" list="ranks" placeholder="Rank">

            <datalist id="ranks">
                <option value="Bronze">
                <option value="Silver">
                <option value="Gold">
                <option value="Platinum">
                <option value="Diamond">
                <option value="Masters">
                <option value="Grandmaster">
                <option value="Champion">
            </datalist>

        </div>

        <div id="videoOptions">
            <div id="grid"></div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
